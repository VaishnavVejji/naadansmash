    <script>
      /* Automatically remove Netlify injected badges/frames */
      (function() {
        function removeNetlifyBadge() {
          const ids = ['nl-badge-frame', 'nl-hud-frame'];
          ids.forEach(function(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
          });
          const iframes = document.querySelectorAll('iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], iframe[srcdoc*="Powered by Netlify"]');
          iframes.forEach(function(f) { f.remove(); });
        }
        removeNetlifyBadge();
        const observer = new MutationObserver(removeNetlifyBadge);
        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
